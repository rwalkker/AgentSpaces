services:
  - type: web
    name: remmy-planner
    runtime: python
    branch: FENIX
    buildCommand: pip install -r requirements.txt -r requirements-web.txt
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cret-wash-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
